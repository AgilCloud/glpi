services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpi}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD_FILE: /run/secrets/glpi_db_password
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - glpi_db_password
    networks:
      - glpi_internal

  glpi:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GLPI_DB_TYPE: ${GLPI_DB_TYPE:-mysql}
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi}
      GLPI_DB_PASSWORD_FILE: /run/secrets/glpi_db_password
      GLPI_TIMEZONE: ${GLPI_TIMEZONE:-America/Bahia}
      GLPI_LANGUAGE: ${GLPI_LANGUAGE:-pt_BR}
      GLPI_ADMIN_USER: ${GLPI_ADMIN_USER:-glpi}
      GLPI_ADMIN_PASSWORD_FILE: /run/secrets/glpi_admin_password
      GLPI_FQDN: ${GLPI_FQDN:-glpi.example.com}
      GLPI_HTTPS: ${GLPI_HTTPS:-false}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_MAX_UPLOAD: ${PHP_MAX_UPLOAD:-128M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
    ports:
      - "${GLPI_HTTP_PORT:-8080}:8080"
    volumes:
      - glpi_files:/var/lib/glpi/files
      - glpi_plugins:/var/lib/glpi/plugins
      - glpi_marketplace:/var/lib/glpi/marketplace
      - glpi_config:/var/lib/glpi/config
      - .secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    secrets:
      - glpi_db_password
      - glpi_admin_password
    networks:
      - glpi_internal

secrets:
  glpi_db_password:
    file: ${GLPI_DB_PASSWORD_FILE:-./secrets/glpi_db_password.txt}
  glpi_admin_password:
    file: ${GLPI_ADMIN_PASSWORD_FILE:-./secrets/glpi_admin_password.txt}

volumes:
  mariadb_data:
  glpi_files:
  glpi_plugins:
  glpi_marketplace:
  glpi_config:

networks:
  glpi_internal:
    driver: bridge
